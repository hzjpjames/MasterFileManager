name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate JS bundle
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -lh android/app/release.keystore

      - name: Configure release signing
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # gradle.properties 中写入签名配置（供 build.gradle 读取）
          cat >> android/gradle.properties << 'EOF'
          MYAPP_RELEASE_STORE_FILE=app/release.keystore
          MYAPP_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          MYAPP_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          MYAPP_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF
          cat android/gradle.properties | grep -E "^MYAPP"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterFileManager-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload keystore info
        if: always()
        run: |
          echo "正式签名信息（仅 SHA256，不含密钥内容）："
          echo "SHA256=$(sha256sum android/app/release.keystore | cut -d' ' -f1)"
          echo "Alias: masterfilemanager"
          echo "有效期: 2026-08-15 至 2053-12-31"
